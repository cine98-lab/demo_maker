<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미리보기 모드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
body{margin:0;background:#eeede8}
a{color:#b8461f}a:hover{color:#8f3415}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #ff7a59;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; color: #1e2233; background: #eeede8; min-height: 900px; display: flex; flex-direction: column;">

  <!-- 얇은 상단 바 -->
  <header style="background: #141b3a; color: #f4f2ff; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
      <a href="Editor.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid #5a4d92; color: #f4f2ff; text-decoration: none; font-size: 14px; font-weight: 700;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f4f2ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        편집으로
      </a>
      <span style="font-size: 13px; color: #ffb3a7;">미리보기 · 방문자에게 보이는 화면이에요</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
      <label for="page-jump" style="font-size: 13px; color: #ffb3a7;">페이지</label>
      <select id="page-jump" value="{{page}}" onChange="{{onPage}}" style="height: 38px; padding: 0 10px; border: 1px solid #5a4d92; border-radius: 8px; background: #3b2f6b; color: #f4f2ff; font: inherit; font-size: 14px;">
        <option value="home">홈</option>
        <option value="detail">상품 상세</option>
        <option value="done">참여 완료</option>
      </select>
      <div role="group" aria-label="기기 전환" style="display: flex; gap: 2px; padding: 3px; border-radius: 8px; background: #3b2f6b;">
        <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: {{d.bg}}; color: {{d.fg}}; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">{{d.label}}</button>
        </sc-for>
      </div>
      <a href="Published.dc.html" style="height: 38px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #ff7a59; color: #141b3a; text-decoration: none; font-size: 14px; font-weight: 800;">배포</a>
    </div>
  </header>

  <!-- 방문자 화면 -->
  <main style="flex: 1; padding: 28px 16px; display: flex; justify-content: center; align-items: flex-start;">
    <div style="position: relative; width: {{frameW}}; max-width: 100%; background: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(20, 27, 58, 0.06), 0 12px 40px rgba(20, 27, 58, 0.12); transition: width 0.3s ease;">
      <div style="padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid #f0efea;">
        <button type="button" onClick="{{goHome}}" style="border: 0; background: transparent; padding: 6px 0; font: inherit; font-size: 17px; font-weight: 800; color: #1e2233; cursor: pointer;">반찬나눔</button>
        <span style="font-size: 13px; color: #5d6378;">상품 · 내 공동구매 · 로그인</span>
      </div>

      <sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
        <div style="padding: 36px 24px; background: #2f7d5b; color: #ffffff; display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 26px; font-weight: 800; line-height: 1.3;">오늘 저녁, 이웃과 반찬을 나눠요</span>
          <span style="font-size: 15px; line-height: 1.6;">소분해서 함께 사면 가격도 양도 딱 맞아요.</span>
        </div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 14px;">
          <span style="font-size: 17px; font-weight: 700;">지금 모집 중인 공동구매</span>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;">
            <sc-for list="{{products}}" as="p" hint-placeholder-count="3">
              <button type="button" onClick="{{goDetail}}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #f0efea; border-radius: 8px; background: #ffffff; font: inherit; text-align: left; color: #1e2233; cursor: pointer;">
                <span style="aspect-ratio: 4 / 3; width: 100%; border-radius: 6px; background: #f5ece4; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8a7f74;">반찬 사진</span>
                <span style="font-size: 14px; font-weight: 700;">{{p.name}}</span>
                <span style="font-size: 13px; color: #5d6378;">{{p.price}} · {{p.status}}</span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isDetail}}" hint-placeholder-val="{{false}}">
        <div style="padding: 24px; display: flex; flex-wrap: wrap; gap: 24px;">
          <div style="flex: 1 1 220px; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 8px; background: #f5ece4; display: flex; align-items: center; justify-content: center; color: #8a7f74; font-size: 13px;">반찬 사진</div>
          <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
            <span style="font-size: 13px; color: #5d6378;">망원동 · 오늘 저녁 7시 마감</span>
            <span style="font-size: 22px; font-weight: 800;">한우 장조림 소분 (200g)</span>
            <span style="font-size: 18px; font-weight: 700;">4,500원</span>
            <span style="font-size: 13px; color: #5d6378;">모집 현황 8 / 10명</span>
            <span style="height: 8px; border-radius: 999px; background: #f0efea; display: block;"><span style="display: block; width: 80%; height: 8px; border-radius: 999px; background: #ff7a59;"></span></span>
            <button type="button" onClick="{{goDone}}" style="margin-top: 6px; height: 48px; border: 0; border-radius: 8px; background: #2f7d5b; color: #ffffff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">공동구매 참여</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <div style="padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
          <span style="width: 56px; height: 56px; border-radius: 999px; background: #e3f4ec; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2f7d5b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          <span style="font-size: 22px; font-weight: 800;">참여 신청이 완료됐어요</span>
          <span style="font-size: 14px; color: #5d6378; line-height: 1.6;">내일 오후 2시부터 6시까지 망원시장 입구에서 받아가세요.</span>
          <button type="button" onClick="{{goHome}}" style="margin-top: 8px; height: 44px; padding: 0 18px; border: 1px solid #e3e2dc; border-radius: 8px; background: #ffffff; font: inherit; font-size: 14px; font-weight: 700; color: #1e2233; cursor: pointer;">홈으로</button>
        </div>
      </sc-if>

      <sc-if value="{{showToast}}" hint-placeholder-val="{{false}}">
        <div role="status" style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 10px 14px; border-radius: 10px; background: #141b3a; color: #f4f2ff; font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 8px;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ffd66b;"></span>데모 동작이에요 · 실제 결제는 일어나지 않아요</div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
var DEVICES = [{ id: 'pc', label: 'PC', w: '1040px' }, { id: 'tablet', label: '태블릿', w: '720px' }, { id: 'mobile', label: '모바일', w: '375px' }];
var PRODUCTS = [
  { name: '한우 장조림 200g', price: '4,500원', status: '8/10명' },
  { name: '시금치 나물 150g', price: '2,800원', status: '5/8명' },
  { name: '멸치 볶음 100g', price: '3,200원', status: '3/6명' }
];
class Component extends DCLogic {
constructor(props) { super(props); this.state = { page: 'home', device: 'pc' }; }
renderVals() {
var self = this;
var st = this.state || {};
var page = st.page || 'home';
var device = st.device || 'pc';
var dev = DEVICES.find(function (d) { return d.id === device; }) || DEVICES[0];
function go(p) { return function () { self.setState({ page: p }); }; }
return {
  page: page,
  onPage: function (e) { self.setState({ page: e.target.value }); },
  devices: DEVICES.map(function (d) { var on = d.id === device; return { label: d.label, pressed: on ? 'true' : 'false', bg: on ? '#ffd66b' : 'transparent', fg: on ? '#141b3a' : '#f4f2ff', pick: function () { self.setState({ device: d.id }); } }; }),
  frameW: dev.w,
  isHome: page === 'home', isDetail: page === 'detail', isDone: page === 'done',
  showToast: page === 'done',
  products: PRODUCTS,
  goHome: go('home'), goDetail: go('detail'), goDone: go('done')
};
}
}
</script>
</body>
</html>
