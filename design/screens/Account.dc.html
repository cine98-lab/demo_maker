<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>계정 설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
body{margin:0;background:#fafaf7}
a{color:#b8461f}a:hover{color:#8f3415}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ff7a59;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; color: #1e2233; background: #fafaf7; min-height: 900px;">

  <header style="background: #ffffff; border-bottom: 1px solid #e3e2dc;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1e2233; font-size: 18px; font-weight: 800;">
        <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><polyline points="4,20 12,8 24,14" fill="none" stroke="#ff7a59" stroke-width="1.5" stroke-linecap="round"></polyline><circle cx="4" cy="20" r="3" fill="#141b3a"></circle><circle cx="12" cy="8" r="3.5" fill="#141b3a"></circle><circle cx="24" cy="14" r="2.5" fill="#141b3a"></circle></svg>
        데모메이커
      </a>
      <a href="Dashboard.dc.html" style="font-size: 15px; font-weight: 700; text-decoration: none; padding: 10px 0;">대시보드로 →</a>
    </div>
  </header>

  <main style="max-width: 720px; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: #3b2f6b; color: #f4f2ff; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #fafaf7, 0 0 0 5px #ffd66b;">서</span>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">계정 설정</h1>
        <span style="font-size: 14px; color: #5d6378;">별자리 4개를 그렸어요</span>
      </div>
    </div>

    <section aria-labelledby="sec-profile" style="padding: 24px; border: 1px solid #e3e2dc; border-radius: 12px; background: #ffffff; display: flex; flex-direction: column; gap: 16px;">
      <h2 id="sec-profile" style="margin: 0; font-size: 16px; font-weight: 700;">프로필</h2>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="name" style="font-size: 14px; font-weight: 700;">이름</label>
        <input id="name" type="text" value="김서연" style="max-width: 360px; height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #e3e2dc; border-radius: 10px; font: inherit; font-size: 15px; color: #1e2233;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 14px; font-weight: 700;">이메일</span>
        <span style="font-size: 15px; color: #5d6378;">seoyeon@example.com</span>
      </div>
    </section>

    <section aria-labelledby="sec-login" style="padding: 24px; border: 1px solid #e3e2dc; border-radius: 12px; background: #ffffff; display: flex; flex-direction: column; gap: 14px;">
      <h2 id="sec-login" style="margin: 0; font-size: 16px; font-weight: 700;">로그인 수단</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
        <li style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #fafaf7;">
          <span style="font-size: 15px; font-weight: 500;">Google</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #23855a;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #23855a;"></span>연결됨</span>
        </li>
        <li style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #fafaf7;">
          <span style="font-size: 15px; font-weight: 500;">카카오</span>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #e3e2dc; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; font-weight: 700; color: #1e2233; cursor: pointer;">연결하기</button>
        </li>
        <li style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #fafaf7;">
          <span style="font-size: 15px; font-weight: 500;">네이버</span>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #e3e2dc; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; font-weight: 700; color: #1e2233; cursor: pointer;">연결하기</button>
        </li>
      </ul>
      <button type="button" style="align-self: flex-start; height: 40px; padding: 0 14px; border: 1px solid #e3e2dc; border-radius: 8px; background: #ffffff; font: inherit; font-size: 14px; font-weight: 700; color: #1e2233; cursor: pointer;">비밀번호 변경</button>
    </section>

    <section aria-labelledby="sec-noti" style="padding: 24px; border: 1px solid #e3e2dc; border-radius: 12px; background: #ffffff; display: flex; flex-direction: column; gap: 14px;">
      <h2 id="sec-noti" style="margin: 0; font-size: 16px; font-weight: 700;">알림 설정</h2>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span id="noti-label" style="font-size: 15px; font-weight: 500;">새 피드백 알림</span>
          <span style="font-size: 13px; color: #5d6378;">누군가 내 데모에 별(핀)을 남기면 이메일로 알려드려요</span>
        </div>
        <button type="button" role="switch" aria-checked="{{notiAria}}" aria-labelledby="noti-label" onClick="{{toggleNoti}}" style="width: 52px; height: 30px; flex: none; border: 0; border-radius: 999px; background: {{notiTrack}}; padding: 3px; display: flex; justify-content: {{notiAlign}}; cursor: pointer; transition: background 0.2s;"><span style="width: 24px; height: 24px; border-radius: 999px; background: {{notiKnob}};"></span></button>
      </div>
    </section>

    <div style="display: flex; justify-content: flex-end;">
      <button type="button" onClick="{{save}}" style="height: 48px; padding: 0 26px; border: 0; border-radius: 12px; background: #ff7a59; color: #141b3a; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;">저장</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 20px; border-top: 1px solid #e3e2dc;">
      <a href="Main.dc.html" style="font-size: 14px; font-weight: 700; color: #1e2233; text-decoration: none; padding: 10px 0;">로그아웃</a>
      <button type="button" style="border: 0; background: transparent; padding: 10px 0; font: inherit; font-size: 14px; color: #c93a3a; cursor: pointer;">회원 탈퇴</button>
    </div>
  </main>

  <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 50%; top: 84px; transform: translateX(-50%); padding: 12px 16px; border-radius: 10px; background: #141b3a; color: #f4f2ff; font-size: 14px; display: flex; align-items: center; gap: 8px;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ffd66b;"></span>저장됨</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { noti: true, saved: false }; }
renderVals() {
var self = this;
var st = this.state || {};
var on = st.noti !== false;
return {
  notiAria: on ? 'true' : 'false',
  notiTrack: on ? '#141b3a' : '#d6d4cc',
  notiKnob: on ? '#ffd66b' : '#ffffff',
  notiAlign: on ? 'flex-end' : 'flex-start',
  toggleNoti: function () { self.setState({ noti: !on, saved: false }); },
  saved: !!st.saved,
  save: function () { self.setState({ saved: true }); }
};
}
}
</script>
</body>
</html>
