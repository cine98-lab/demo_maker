<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AI 생성 로딩</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
body{margin:0;background:#141b3a}
a{color:#ffd66b}a:hover{color:#ffe59a}
button:focus-visible,a:focus-visible{outline:2px solid #ffd66b;outline-offset:3px}
@keyframes dmPulse{0%{box-shadow:0 0 0 0 rgba(255,214,107,.55)}100%{box-shadow:0 0 0 18px rgba(255,214,107,0)}}
@keyframes dmTwinkle{0%,100%{opacity:.25}50%{opacity:.6}}
.dm-pulse{animation:dmPulse 1.2s ease-out infinite}
.dm-twinkle{animation:dmTwinkle 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.dm-pulse,.dm-twinkle{animation:none}}
</style>
</helmet>
<div style="font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; color: #f4f2ff; background: #141b3a; min-height: 900px; display: flex; flex-direction: column;">

  <header style="max-width: 1200px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
    <span style="display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800;">
      <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><polyline points="4,20 12,8 24,14" fill="none" stroke="#ffb3a7" stroke-width="1.5" stroke-linecap="round"></polyline><circle cx="4" cy="20" r="3" fill="#ffd66b"></circle><circle cx="12" cy="8" r="3.5" fill="#ffd66b"></circle><circle cx="24" cy="14" r="2.5" fill="#ffd66b"></circle></svg>
      데모메이커
    </span>
    <a href="NewProject.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none; padding: 10px 0; color: #ffb3a7;">취소하고 돌아가기</a>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; box-sizing: border-box; padding: 16px 24px 56px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <p style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: #ffb3a7;">{{eyebrow}}</p>
      <h1 aria-live="polite" style="margin: 0; font-size: 36px; line-height: 1.3; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance;">{{headline}}</h1>
      <p style="margin: 0; max-width: 34em; font-size: 15px; line-height: 1.7; color: #f4f2ff;">"1인 가구를 위한 동네 반찬 공동구매 서비스"</p>
    </div>

    <!-- 별자리가 그려지는 영역 -->
    <div style="position: relative; width: 100%; max-width: 760px; height: 340px;">
      <div aria-hidden="true" style="position: absolute; inset: 0;">
        <span class="dm-twinkle" style="position: absolute; left: 6%; top: 12%; width: 3px; height: 3px; border-radius: 999px; background: #f4f2ff;"></span>
        <span class="dm-twinkle" style="position: absolute; left: 44%; top: 6%; width: 2px; height: 2px; border-radius: 999px; background: #f4f2ff; animation-delay: 1s;"></span>
        <span class="dm-twinkle" style="position: absolute; left: 94%; top: 16%; width: 3px; height: 3px; border-radius: 999px; background: #f4f2ff; animation-delay: 2s;"></span>
        <span class="dm-twinkle" style="position: absolute; left: 70%; top: 92%; width: 2px; height: 2px; border-radius: 999px; background: #f4f2ff; animation-delay: .5s;"></span>
        <span class="dm-twinkle" style="position: absolute; left: 4%; top: 88%; width: 2px; height: 2px; border-radius: 999px; background: #f4f2ff; animation-delay: 1.5s;"></span>
      </div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
        <g fill="none" stroke="#ffb3a7" stroke-width="1.5" stroke-linecap="round">
          <line x1="12" y1="50" x2="32" y2="26" vector-effect="non-scaling-stroke" style="opacity: {{l0}}; transition: opacity 0.6s ease;"></line>
          <line x1="32" y1="26" x2="52" y2="44" vector-effect="non-scaling-stroke" style="opacity: {{l1}}; transition: opacity 0.6s ease;"></line>
          <line x1="52" y1="44" x2="72" y2="22" vector-effect="non-scaling-stroke" style="opacity: {{l2}}; transition: opacity 0.6s ease;"></line>
          <line x1="72" y1="22" x2="88" y2="48" vector-effect="non-scaling-stroke" style="opacity: {{l3}}; transition: opacity 0.6s ease;"></line>
          <line x1="12" y1="50" x2="30" y2="80" vector-effect="non-scaling-stroke" style="opacity: {{l4}}; transition: opacity 0.6s ease;"></line>
        </g>
      </svg>
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="6">
        <div style="position: absolute; left: {{s.x}}%; top: {{s.y}}%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: {{s.o}}; transition: opacity 0.6s ease;">
          <span class="{{s.cls}}" style="width: {{s.d}}px; height: {{s.d}}px; border-radius: 999px; background: #ffd66b; margin-top: 24px;"></span>
          <span style="font-size: 13px; font-weight: 500; white-space: nowrap;">{{s.label}}</span>
        </div>
      </sc-for>
    </div>

    <!-- 진행 상황 -->
    <div style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; font-size: 13px;">
          <span style="color: #ffb3a7;">{{stepNow}}</span>
          <span style="font-weight: 700; font-variant-numeric: tabular-nums;">{{pct}}%</span>
        </div>
        <div role="progressbar" aria-label="생성 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="height: 6px; border-radius: 999px; background: #3b2f6b; overflow: hidden;">
          <div style="width: {{pct}}%; height: 6px; border-radius: 999px; background: #ff7a59; transition: width 0.6s ease;"></div>
        </div>
      </div>
      <ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; text-align: left;">
        <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
          <li style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{st.color}}; font-weight: {{st.weight}};">
            <span style="width: 10px; height: 10px; border-radius: 999px; background: {{st.dot}}; border: 1.5px {{st.borderStyle}} {{st.border}}; box-sizing: border-box; flex: none;"></span>
            {{st.label}}
          </li>
        </sc-for>
      </ol>
    </div>

    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;">
        <a href="Structure.dc.html" style="display: inline-flex; align-items: center; height: 52px; padding: 0 28px; border-radius: 12px; background: #ff7a59; color: #141b3a; text-decoration: none; font-size: 16px; font-weight: 800;">구조 확인하기</a>
        <button type="button" onClick="{{replay}}" style="height: 52px; padding: 0 20px; border: 1px solid #5a4d92; border-radius: 12px; background: #3b2f6b; color: #f4f2ff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">처음부터 다시 보기</button>
      </div>
    </sc-if>
    <sc-if value="{{working}}" hint-placeholder-val="{{true}}">
      <p style="margin: 0; font-size: 13px; color: #ffb3a7;">보통 30초 안에 끝나요. 이 창을 닫아도 대시보드에 저장돼요.</p>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
var STARS = [
  { label: '홈', x: 12, y: 50, r: 9 },
  { label: '상품 목록', x: 32, y: 26, r: 7 },
  { label: '상품 상세', x: 52, y: 44, r: 8 },
  { label: '공동구매 참여', x: 72, y: 22, r: 10 },
  { label: '결제 완료', x: 88, y: 48, r: 6 },
  { label: '마이페이지', x: 30, y: 80, r: 6 }
];
var STEPS = ['아이디어 읽기', '페이지 구성 정하기', '문구와 샘플 데이터 쓰기', '화면 그리기'];
var STEP_AT = [2, 4, 6, 8];
var LAST = 9;
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tick: 0 };
}
componentDidMount() { this.start(); }
componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
start() {
var self = this;
if (this.timer) clearInterval(this.timer);
this.timer = setInterval(function () {
  var t = (self.state && self.state.tick) || 0;
  if (t >= LAST) { clearInterval(self.timer); self.timer = null; return; }
  self.setState({ tick: t + 1 });
}, 700);
}
renderVals() {
var self = this;
var tick = (this.state && this.state.tick) || 0;
var done = tick >= LAST;
var visibleStars = Math.min(STARS.length, tick);
var activeStep = STEP_AT.findIndex(function (at) { return tick < at; });
function lineO(j) { return tick > j + 1 ? 0.8 : 0; }
return {
  done: done,
  working: !done,
  eyebrow: done ? '별자리 완성' : 'AI가 초안을 그리는 중',
  headline: done ? '당신의 꿈이 형태를 갖췄어요' : '당신의 생각을 이어 형태를 만들고 있어요',
  pct: Math.min(100, Math.round(tick / LAST * 100)),
  stepNow: done ? '페이지 6개를 만들었어요' : STEPS[activeStep < 0 ? STEPS.length - 1 : activeStep] + ' 중',
  l0: lineO(0), l1: lineO(1), l2: lineO(2), l3: lineO(3), l4: lineO(4),
  stars: STARS.map(function (s, i) {
    var shown = i < visibleStars;
    var newest = !done && i === visibleStars - 1;
    return { label: s.label, x: s.x, y: s.y, d: s.r * 2, o: shown ? 1 : 0, cls: (newest || (done && i === 3)) ? 'dm-pulse' : '' };
  }),
  steps: STEPS.map(function (label, k) {
    var isDone = tick >= STEP_AT[k];
    var isActive = !isDone && k === activeStep;
    return {
      label: label,
      color: isDone || isActive ? '#f4f2ff' : '#a9a3cf',
      weight: isActive ? 700 : 500,
      dot: isDone ? '#ffd66b' : 'rgba(0,0,0,0)',
      border: isDone ? '#ffd66b' : (isActive ? '#ff7a59' : '#8d86b8'),
      borderStyle: isDone || isActive ? 'solid' : 'dashed'
    };
  }),
  replay: function () { self.setState({ tick: 0 }); self.start(); }
};
}
}
</script>
</body>
</html>
