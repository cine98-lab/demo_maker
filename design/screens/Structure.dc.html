<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>구조 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
body{margin:0;background:#fafaf7}
a{color:#b8461f}a:hover{color:#8f3415}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ff7a59;outline-offset:2px}
</style>
</helmet>
<div style="font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; color: #1e2233; background: #fafaf7; min-height: 900px; display: flex; flex-direction: column;">

  <header style="background: #ffffff; border-bottom: 1px solid #e3e2dc;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1e2233; font-size: 18px; font-weight: 800;">
        <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><polyline points="4,20 12,8 24,14" fill="none" stroke="#ff7a59" stroke-width="1.5" stroke-linecap="round"></polyline><circle cx="4" cy="20" r="3" fill="#141b3a"></circle><circle cx="12" cy="8" r="3.5" fill="#141b3a"></circle><circle cx="24" cy="14" r="2.5" fill="#141b3a"></circle></svg>
        데모메이커
      </a>
      <ol aria-label="진행 단계" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px;">
        <li style="display: flex; align-items: center; gap: 8px; color: #5d6378;"><span style="width: 10px; height: 10px; border-radius: 999px; background: #141b3a;"></span>시작 방법</li>
        <li aria-hidden="true" style="width: 32px; height: 1px; background: #ff7a59;"></li>
        <li style="display: flex; align-items: center; gap: 8px; color: #5d6378;"><span style="width: 10px; height: 10px; border-radius: 999px; background: #141b3a;"></span>정보 입력</li>
        <li aria-hidden="true" style="width: 32px; height: 1px; background: #ff7a59;"></li>
        <li aria-current="step" style="display: flex; align-items: center; gap: 8px; font-weight: 700;"><span style="width: 12px; height: 12px; border-radius: 999px; background: #ffd66b; box-shadow: 0 0 0 3px #141b3a;"></span>구조 확인</li>
      </ol>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 32px 24px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;">이런 구성으로 만들어 볼게요</h1>
      <p style="margin: 0; font-size: 15px; color: #5d6378;">"1인 가구를 위한 동네 반찬 공동구매 서비스" · 친근한 분위기 · 주요 기능: 상품 목록, 공동구매 참여, 결제 <a href="#" style="font-weight: 700; margin-left: 6px;">수정</a></p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch;">

      <!-- 왼쪽: 페이지 지도 (별자리) -->
      <section aria-labelledby="map-title" style="flex: 999 1 560px; min-width: 0; background: #141b3a; color: #f4f2ff; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
          <h2 id="map-title" style="margin: 0; font-size: 18px; font-weight: 700;">페이지 지도 <span style="font-weight: 500; color: #ffb3a7;">· 7개</span></h2>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #5a4d92; border-radius: 8px; background: #3b2f6b; color: #f4f2ff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffd66b" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            페이지 추가
          </button>
        </div>
        <div style="position: relative; height: 420px;">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
            <g fill="none" stroke="#ffb3a7" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
              <line x1="12" y1="50" x2="32" y2="26" vector-effect="non-scaling-stroke"></line>
              <line x1="32" y1="26" x2="52" y2="42" vector-effect="non-scaling-stroke"></line>
              <line x1="52" y1="42" x2="72" y2="22" vector-effect="non-scaling-stroke"></line>
              <line x1="72" y1="22" x2="88" y2="44" vector-effect="non-scaling-stroke"></line>
              <line x1="12" y1="50" x2="28" y2="78" vector-effect="non-scaling-stroke"></line>
              <line x1="52" y1="42" x2="62" y2="76" vector-effect="non-scaling-stroke" stroke-dasharray="3 5"></line>
            </g>
          </svg>
          <button type="button" style="position: absolute; left: 12%; top: 50%; transform: translate(-50%, -14px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #f4f2ff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; min-width: 44px;"><span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;"><span style="width: 20px; height: 20px; border-radius: 999px; background: #ffd66b;"></span></span>홈</button>
          <button type="button" style="position: absolute; left: 32%; top: 26%; transform: translate(-50%, -14px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #f4f2ff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; min-width: 44px;"><span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;"><span style="width: 14px; height: 14px; border-radius: 999px; background: #ffd66b;"></span></span>상품 목록</button>
          <button type="button" aria-pressed="true" style="position: absolute; left: 52%; top: 42%; transform: translate(-50%, -14px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #ffd66b; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; min-width: 44px;"><span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 999px; box-shadow: 0 0 0 2px #ff7a59, 0 0 24px rgba(255, 214, 107, 0.45);"><span style="width: 16px; height: 16px; border-radius: 999px; background: #ffd66b;"></span></span>상품 상세</button>
          <button type="button" style="position: absolute; left: 72%; top: 22%; transform: translate(-50%, -14px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #f4f2ff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; min-width: 44px;"><span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;"><span style="width: 16px; height: 16px; border-radius: 999px; background: #ffd66b;"></span></span>공동구매 참여</button>
          <button type="button" style="position: absolute; left: 88%; top: 44%; transform: translate(-50%, -14px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #f4f2ff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; min-width: 44px;"><span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;"><span style="width: 12px; height: 12px; border-radius: 999px; background: #ffd66b;"></span></span>결제 완료</button>
          <button type="button" style="position: absolute; left: 28%; top: 78%; transform: translate(-50%, -14px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #f4f2ff; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; min-width: 44px;"><span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;"><span style="width: 12px; height: 12px; border-radius: 999px; background: #ffd66b;"></span></span>마이페이지</button>
          <button type="button" style="position: absolute; left: 62%; top: 76%; transform: translate(-50%, -14px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: #ffb3a7; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; min-width: 44px;"><span style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;"><span style="width: 14px; height: 14px; border-radius: 999px; border: 2px dashed #ffb3a7; box-sizing: border-box;"></span></span>후기 (새로 추가)</button>
        </div>
        <p style="margin: 0; font-size: 13px; color: #ffb3a7;">별을 눌러 내용을 보고, 끌어서 순서를 바꿀 수 있어요.</p>
      </section>

      <!-- 오른쪽: 선택한 페이지 내용 -->
      <section aria-labelledby="detail-title" style="flex: 1 1 340px; min-width: 0; background: #ffffff; border: 1px solid #e3e2dc; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px;">
        <h2 id="detail-title" style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #b8461f;">선택한 페이지</h2>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="page-name" style="font-size: 14px; font-weight: 700;">페이지 이름</label>
          <input id="page-name" type="text" value="상품 상세" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #e3e2dc; border-radius: 8px; font: inherit; font-size: 15px; color: #1e2233;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <h3 style="margin: 0; font-size: 14px; font-weight: 700;">핵심 내용</h3>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px;">
            <li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #fafaf7;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ff7a59; flex: none;"></span>반찬 사진과 이름, 소분 단위</li>
            <li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #fafaf7;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ff7a59; flex: none;"></span>공동구매 모집 현황 (참여 인원 / 목표 인원)</li>
            <li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #fafaf7;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ff7a59; flex: none;"></span>마감 시간과 픽업 장소</li>
            <li style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #fafaf7;"><span style="width: 8px; height: 8px; border-radius: 999px; background: #ff7a59; flex: none;"></span>[공동구매 참여] 버튼 → 공동구매 참여</li>
          </ul>
        </div>
        <button type="button" style="margin-top: auto; align-self: flex-start; height: 40px; padding: 0 14px; border: 1px solid #e3e2dc; border-radius: 8px; background: #ffffff; color: #c93a3a; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">이 페이지 삭제</button>
      </section>
    </div>
  </main>

  <footer style="background: #ffffff; border-top: 1px solid #e3e2dc;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <a href="#" style="font-size: 15px; font-weight: 700; color: #1e2233; text-decoration: none; padding: 12px 18px; border: 1px solid #e3e2dc; border-radius: 12px;">이전</a>
      <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <button type="button" style="height: 48px; padding: 0 18px; border: 1px solid #e3e2dc; border-radius: 12px; background: #ffffff; color: #1e2233; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">다시 제안받기</button>
        <a href="Editor.dc.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 26px; border-radius: 12px; background: #ff7a59; color: #141b3a; text-decoration: none; font-size: 16px; font-weight: 800;">생성하기</a>
      </div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
